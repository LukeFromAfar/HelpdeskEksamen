name: Deploy NodeJS Application

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Pull latest changes
      run: |
        cd /var/www/HelpdeskEksamen
        git pull origin main
        echo "Pull latest changes completed successfully at $(date)"
        
    - name: Set up NVM and Node
      run: |
        export NVM_DIR="/home/lukasz/.nvm"
        [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
        echo "Node version: $(node -v)"
        echo "PM2 path: $(which pm2)"
        
    - name: Reload PM2
      run: |
        cd /var/www/HelpdeskEksamen
        export NVM_DIR="/home/lukasz/.nvm"
        [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
        pm2 reload HelpdeskEksamen || pm2 restart HelpdeskEksamen
        echo "Reload of PM2 completed successfully at $(date)"
        
    - name: Verify deployment
      run: |
        echo "Deployment completed successfully at $(date)"
